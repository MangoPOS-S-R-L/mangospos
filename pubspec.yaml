  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

msix_config:
  display_name: "MangoPOS Restaurant"
  publisher_display_name: "Mango POS"
  identity_name: MangoPOS.MangoPOSRestaurant
  publisher: "CN=B178130F-7700-44FD-BEF2-B0F7F05AC658"
  msix_version: 1.0.0.0
  logo_path: assets/images/logo.png
  capabilities: internetClient, location, bluetooth
  languages: es-DO, en-US
  description: Professional POS system for restaurants.
  store: true
  architecture: x64
