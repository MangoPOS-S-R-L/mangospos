<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MangoPOS Print Agent</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f4f4f9; color: #333; }
    h1 { color: #2c3e50; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .status { padding: 10px; border-radius: 4px; display: inline-block; font-weight: bold; }
    .status.online { background: #d4edda; color: #155724; }
    .status.offline { background: #f8d7da; color: #721c24; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
    button { padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
    input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
    pre { background: #eee; padding: 10px; border-radius: 4px; overflow-x: auto; }
  </style>
</head>
<body>

  <h1>MangoPOS Print Agent</h1>

  <div class="card">
    <h2>Service Status</h2>
    <div id="serviceStatus" class="status offline">Check logs...</div>
    <p><strong>Uptime:</strong> <span id="uptime">-</span> seconds</p>
    <p><strong>Queue:</strong> <span id="queueCount">0</span> jobs</p>
    <button onclick="refreshStatus()">Refresh</button>
  </div>

  <div class="card">
    <h2>Printers</h2>
    <h3>Configured</h3>
    <table id="configuredPrinters">
      <thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Endpoint</th><th>Actions</th></tr></thead>
      <tbody><tr><td colspan="5">Loading...</td></tr></tbody>
    </table>

    <h3>Discovered (LAN)</h3>
    <table id="discoveredPrinters">
      <thead><tr><th>Address</th><th>Name</th><th>Actions</th></tr></thead>
      <tbody><tr><td colspan="3">Scanning...</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Configuration</h2>
    <p>API Token: <input type="password" id="apiToken" placeholder="Leave empty if disabled" /></p>
    <button onclick="saveConfig()">Save Config</button>
    <p><small>* Requires restart</small></p>
  </div>

<script>
  const API_URL = ''; // Relative

  // Get token from local storage or prompt?
  // For admin UI on localhost, maybe we allow simplified access or require token?
  // The server implementation checks token for all routes including /status and /printers if security enabled.
  // We'll prompt if needed.
  let token = localStorage.getItem('mangopos_agent_token') || 'MANGOPOS_SECURE_TOKEN_123';

  async function fetchAPI(endpoint, options = {}) {
      const headers = { 
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json',
          ...options.headers 
      };
      const res = await fetch(API_URL + endpoint, { ...options, headers });
      if (res.status === 401) {
          const newToken = prompt('Enter API Token:');
          if (newToken) {
             token = newToken;
             localStorage.setItem('mangopos_agent_token', token);
             return fetchAPI(endpoint, options);
          }
      }
      return res;
  }

  async function refreshStatus() {
    try {
      const res = await fetchAPI('/status');
      const data = await res.json();
      document.getElementById('serviceStatus').innerText = 'Running v' + data.version;
      document.getElementById('serviceStatus').className = 'status online';
      document.getElementById('uptime').innerText = Math.floor(data.uptime);
      document.getElementById('queueCount').innerText = data.queue.active;
      refreshPrinters();
    } catch (e) {
      document.getElementById('serviceStatus').innerText = 'Error connection';
      document.getElementById('serviceStatus').className = 'status offline';
    }
  }

  async function refreshPrinters() {
    try {
      const res = await fetchAPI('/printers');
      const { configured, discovered } = await res.json();
      
      const confTbody = document.querySelector('#configuredPrinters tbody');
      confTbody.innerHTML = configured.map(p => `
        <tr>
          <td>${p.id}</td>
          <td>${p.name}</td>
          <td>${p.type}</td>
          <td>${p.endpoint}</td>
          <td><button onclick="testPrint('${p.id}')">Test</button></td>
        </tr>
      `).join('') || '<tr><td colspan="5">No printers configured</td></tr>';

      const discTbody = document.querySelector('#discoveredPrinters tbody');
      discTbody.innerHTML = discovered.map(d => `
        <tr>
            <td>${d.address}</td>
            <td>${d.name || 'Unknown'}</td>
            <td><button onclick="addPrinter('${d.address}', '${d.name}')">Add</button></td>
        </tr>
      `).join('') || '<tr><td colspan="3">No devices found</td></tr>';

    } catch (e) {
      console.error(e);
    }
  }

  async function testPrint(printerId) {
      await fetchAPI('/test-print', {
          method: 'POST',
          body: JSON.stringify({ printerId })
      });
      alert('Test print queued!');
  }

  async function addPrinter(ip, name) {
      // Logic to add to config... (Conceptual, needs robust config update endpoint logic)
      const id = prompt('Assign ID:', 'printer_' + ip.replace(/\./g, '_'));
      if(!id) return;
      
      // We need to fetch current config, modify, save.
      // Implementing full config editor in this single HTML file is complex but doable.
      // For simplicity, we just alert.
      alert('To add this printer, please edit config.yaml or use the full admin panel (Coming Soon).');
  }

  // Load initial
  refreshStatus();
  setInterval(refreshStatus, 10000);

</script>
</body>
</html>
