
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  macos:
    generate: true
    # Ya trae el cuadrado blanco redondeado con margen y sombra (plantilla de
    # íconos de macOS). El logo solo es transparente y en el Dock no tenía
    # fondo.
    image_path: "assets/images/app_icon_macos.png"
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 256
